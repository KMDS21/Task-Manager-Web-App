name: CD - Deploy to AWS EC2

on:
  push:
    branches: [ main, feature/testing, ui ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy Frontend & Backend to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Ensure PATH includes Node.js and PM2 binaries
            export PATH=$PATH:/usr/bin:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # 1. Ensure deployment directory exists
            mkdir -p ~/app
            cd ~/app

            # 2. Clone or fetch latest code from repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/KMDS21/Task-Manager-Web-App.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # 3. Install backend production dependencies
            cd ~/app/backend
            npm ci --production

            # 4. Restart or start Node.js backend using PM2
            pm2 restart task-manager-backend || pm2 start server.js --name "task-manager-backend"
            pm2 save

            # 5. Build React frontend for production
            cd ~/app/frontend
            npm install
            npm run build

            # 6. Configure Nginx to serve React frontend + Reverse Proxy /api to Express
            sudo bash -c 'cat > /etc/nginx/sites-available/default << "EOF"
            server {
                listen 80 default_server;
                listen [::]:80 default_server;

                root /home/ubuntu/app/frontend/dist;
                index index.html;

                server_name _;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api {
                    proxy_pass http://localhost:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }

                location /uploads {
                    proxy_pass http://localhost:5000/uploads;
                }
            }
            EOF'

            # 7. Reload Nginx
            sudo systemctl restart nginx
            echo "🚀 Full-Stack Deployment (Frontend + Backend) to AWS EC2 completed successfully!"