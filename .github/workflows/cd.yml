name: CD - Deploy to AWS EC2

on:
  push:
    branches: [ main, feature/testing, ui ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure deployment directory exists
            mkdir -p ~/app
            cd ~/app

            # Clone or fetch latest code from repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/KMDS21/Task-Manager-Web-App.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Install backend production dependencies
            cd backend
            npm ci --production

            # Create production .env if it does not exist
            if [ ! -f ".env" ]; then
              echo "PORT=5000" > .env
              echo "NODE_ENV=production" >> .env
              echo "DATABASE_URL=postgresql://neondb_owner:npg_dJe4XGsQpRf3@ep-spring-cherry-b3iwm3zi-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require" >> .env
              echo "JWT_SECRET=your_super_secret_key_change_this_in_production" >> .env
              echo "JWT_EXPIRES_IN=7d" >> .env
            fi

            # Ensure PM2 is installed globally
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Restart or start Node.js backend using PM2
            pm2 restart task-manager-backend || pm2 start server.js --name "task-manager-backend"
            pm2 save
