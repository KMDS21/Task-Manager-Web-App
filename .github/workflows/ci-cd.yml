# ============================================================
# GitHub Actions CI/CD Workflow for Task Manager Web App
# ============================================================
# This file defines two automated jobs:
#   1. test  - Runs on every push/PR to main (always)
#   2. deploy - Runs only on push to main IF tests pass
#
# Think of this like a robot that automatically:
#   - Checks your code works (test job)
#   - Ships it to production if it does (deploy job)
# ============================================================

name: CI/CD Pipeline

# ─────────────────────────────────────────
# TRIGGERS: When should this workflow run?
# ─────────────────────────────────────────
on:
  push:
    branches:
      - main          # Run when code is merged/pushed to main
  pull_request:
    branches:
      - main          # Run when a PR is opened against main (tests only)

# ─────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────
jobs:

  # ===========================================================
  # JOB 1: TEST
  # Installs dependencies, creates a real Postgres DB, runs Jest
  # ===========================================================
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest   # Use a fresh Ubuntu VM provided by GitHub

    # -----------------------------------------------------------
    # SERVICES: Spin up a real PostgreSQL container alongside
    # the runner so our tests can connect to it.
    # -----------------------------------------------------------
    services:
      postgres:
        image: postgres:15                        # Use the official Postgres 15 image
        env:
          POSTGRES_DB: taskmanager_test           # Database name for tests
          POSTGRES_USER: postgres                 # Superuser username
          POSTGRES_PASSWORD: postgres             # Superuser password
        ports:
          - 5432:5432                             # Map container port to runner port
        # Health check: keep retrying until Postgres is actually ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1 — Get the code from GitHub onto the runner
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Install Node.js 18 on the runner
      - name: ⚙️ Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3 — Cache node_modules so repeat runs are faster
      # The cache key includes the OS and a hash of package-lock.json.
      # If package-lock.json hasn't changed, cached modules are restored
      # and we skip the slow npm ci step on subsequent runs.
      - name: 📦 Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      # Step 4 — Install backend dependencies (clean install = respects lock file)
      - name: 📥 Install backend dependencies
        run: cd backend && npm ci

      # Step 5 — Create a .env file so the backend can connect to the test DB.
      # We pull values from GitHub Secrets for sensitive credentials.
      # The DB_HOST is 'localhost' because the Postgres service is mapped to
      # the runner's localhost via the port mapping above.
      - name: 🔐 Create backend .env file for testing
        run: |
          cat > backend/.env << EOF
          # Server
          NODE_ENV=test
          PORT=5000

          # Database — points to the Postgres service container above
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=taskmanager_test
          DB_USER=postgres
          DB_PASSWORD=postgres

          # JWT — use the secret stored in GitHub Secrets
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          # File uploads (not needed for tests, but avoids missing-env errors)
          UPLOAD_DIR=uploads
          EOF

      # Step 6 — Run the Jest test suite
      - name: 🧪 Run tests
        run: cd backend && npm test

  # ===========================================================
  # JOB 2: DEPLOY
  # Only runs when:
  #   - The 'test' job above passed (needs: test)
  #   - AND the event is a push to main (not a PR)
  # ===========================================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test                             # Wait for tests to pass first
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1 — Get the latest code
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Setup Node.js (needed for frontend build in next step)
      - name: ⚙️ Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3 — Install backend production dependencies locally
      # (We verify the install works before shipping to the server)
      - name: 📥 Install backend dependencies
        run: cd backend && npm ci --omit=dev

      # Step 4 — Build the React frontend into static files (dist/)
      # The EC2 server will serve these files via Nginx.
      - name: 🏗️ Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # Step 5 — SSH into the EC2 instance and run deployment commands.
      # appleboy/ssh-action connects using the private key stored in secrets.
      #
      # What happens on the server:
      #   1. Pull latest code from GitHub
      #   2. Reinstall backend production dependencies
      #   3. Restart the app with PM2 (or start it if first deploy)
      #   4. Rebuild the React frontend so Nginx serves fresh files
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}         # Your EC2 public IP address
          username: ${{ secrets.EC2_USER }}     # Usually 'ubuntu' for Ubuntu AMIs
          key: ${{ secrets.EC2_SSH_KEY }}       # Contents of your .pem private key file
          script: |
            # Navigate to the project folder on the server
            cd ~/task-manager

            # Pull the latest code from GitHub
            git pull origin main

            # ── Backend ──────────────────────────────────────
            cd backend

            # Install only production dependencies (no dev tools like Jest)
            npm ci --omit=dev

            # Restart app with PM2, or start it if this is the first deploy.
            # "|| pm2 start" means: if restart fails (app not running yet), start it.
            pm2 restart task-manager || pm2 start server.js --name task-manager

            # ── Frontend ─────────────────────────────────────
            cd ../frontend

            # Install frontend dependencies
            npm ci

            # Rebuild static files — Nginx will pick these up automatically
            npm run build

            # ── Save PM2 process list so it survives server reboots ──
            pm2 save
